# Unjam — Unblock Assistant for Jira (Codegeist 2026)
#
# Manifest verified against the official Forge manifest reference:
#   - rovo:agent  https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-agent/
#   - rovo:skill  https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-skill/
#   - rovo:mcp    https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-mcp/
#   - action      https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-action/
#
# Notes:
# - The rovo:mcp module has NO description property in the official reference
#   (only key, name, tools), so none is declared here.
# - The rovo:skill module references its directory via source.dir, and declares
#   its action dependencies via dependencies.tools.
# - No license key is declared by design: apps with a license cannot be shared
#   via an installation link, which is how the judges install Unjam.
# - No permissions.external: Unjam runs entirely on Atlassian (no egress).
#
# app.id registered 14 Nov 2026 via `forge register` (Developer Space Unjam).
#
# UI (from 14 Nov 2026 maximization): Forge Custom UI — one Vite + React
# project under static/unjam-ui with three entries (issue panel, project
# page, admin settings page). The previous UI Kit frontend is preserved on
# the `uikit-fallback` branch. The icon lives in assets/ (not static/) so
# the `static` resource does not sweep up the Vite project.

modules:
  jira:issuePanel:
    - key: unjam-issue-panel
      resource: unjam-ui/panel
      resolver:
        function: resolver
      title: Unjam
      icon: resource:static;icon.svg

  jira:projectPage:
    - key: unjam-project-page
      resource: unjam-ui/page
      resolver:
        function: resolver
      title: Unjam — Blocked Work

  jira:adminPage:
    - key: unjam-admin-page
      resource: unjam-ui/admin
      resolver:
        function: resolver
      title: Unjam settings
      useAsConfig: true
      layout: blank

  rovo:agent:
    - key: unjam-agent
      name: Unjam
      description: Finds who can unblock stuck Jira work, explains why, drafts the
        ask, and follows up.
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - Who can unblock this issue?
        - What is the most expensive blocker in this project?
        - Draft an unblock request for me.
      actions:
        - get-blockers
        - find-unblockers
        - get-block-cost
        - draft-unblock-request
        - send-unblock-request
      skills:
        - unblock-playbook

  action:
    - key: get-blockers
      name: Get blockers
      function: fn-get-blockers
      actionVerb: GET
      description: >
        What is blocking this Jira issue? Traces the chain of issues blocking
        it, including blockers of blockers, and reports each blocker's status,
        assignee, and how many other issues are waiting on it.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key to trace blockers for, for example ORB-42. When
            omitted, the issue currently open in Jira is used.

    - key: find-unblockers
      name: Find unblockers
      function: fn-find-unblockers
      actionVerb: GET
      description: >
        Who can unblock this Jira issue, and why are they the best person to
        ask? Ranks the people who can open the blocker — its owner, recent
        contributors, and experts on similar work — with an explainable score
        for each candidate.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key to find unblockers for, for example ORB-42. When
            omitted, the issue currently open in Jira is used.

    - key: get-block-cost
      name: Get block cost
      function: fn-get-block-cost
      actionVerb: GET
      description: >
        How expensive is this blocker — or which blocker in this project costs
        the team the most? Scores the cost of waiting from the blocker's age,
        how many issues are waiting on it, how close the deadline is, and the
        priority.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key whose block cost to score, for example ORB-42.
            When omitted, the issue currently open in Jira is used.
        projectKey:
          title: Project key
          type: string
          required: false
          description: The Jira project key to rank blocked work for, for example ORB.
            When provided, returns the most expensive blockers in the project
            instead of scoring a single issue.

    - key: draft-unblock-request
      name: Draft unblock request
      function: fn-draft-request
      actionVerb: GET
      description: >
        What should I say to the person who can unblock this issue? Drafts a
        polite, ready-to-send request mentioning the best unblocker, with the
        context they need: what is blocked, for how long, and what is waiting on
        it.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key to draft an unblock request for, for example
            ORB-42. When omitted, the issue currently open in Jira is used.
        unblocker:
          title: Unblocker
          type: string
          required: false
          description: The name of the person to address the request to. When omitted, the
            top-ranked unblocker is used.

    - key: send-unblock-request
      name: Send unblock request
      function: fn-send-unblock-request
      actionVerb: CREATE
      description: >
        Send the unblock request to the person who can unblock this issue.
        Posts it as a comment on the blocking issue, mentions the unblocker,
        and tracks it for follow-up within the configured SLA. Only call after
        the user has seen the draft and confirmed.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key to send an unblock request for, for example
            ORB-42. When omitted, the issue currently open in Jira is used.
        unblocker:
          title: Unblocker
          type: string
          required: false
          description: The name of the person to address the request to. When omitted, the
            top-ranked unblocker is used.
        message:
          title: Additional message
          type: string
          required: false
          description: An extra note from the user to include in the posted comment, for
            example extra context or a deadline.

  rovo:skill:
    - key: unblock-playbook
      source:
        dir: skills/unblock-playbook
      dependencies:
        tools:
          - get-blockers
          - find-unblockers
          - get-block-cost
          - draft-unblock-request
          - send-unblock-request

  rovo:mcp:
    - key: unjam-mcp
      name: Unjam
      tools:
        - get-blockers
        - find-unblockers
        - get-block-cost
        - draft-unblock-request
        - send-unblock-request

  scheduledTrigger:
    - key: unjam-daily-watch
      function: watch
      interval: day

  function:
    - key: resolver
      handler: resolver.handler
    - key: fn-get-blockers
      handler: index.getBlockers
    - key: fn-find-unblockers
      handler: index.findUnblockers
    - key: fn-get-block-cost
      handler: index.getBlockCost
    - key: fn-draft-request
      handler: index.draftUnblockRequest
    - key: fn-send-unblock-request
      handler: index.sendUnblockRequest
    - key: watch
      handler: scheduled.run
      timeoutSeconds: 300

resources:
  # One Vite project (static/unjam-ui) with three HTML entries, one per
  # module. Rebuild with `npm run build:ui` before `forge deploy` — Forge
  # serves the built output, not the sources.
  - key: unjam-ui
    path: static/unjam-ui/build
    entry:
      panel: issue-panel.html
      page: project-page.html
      admin: admin-page.html
  - key: agent-prompt
    path: prompts
  - key: static
    path: assets

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - storage:app
    - read:graph:issue:jira
    - read:graph:issue-status:jira
    - read:graph:issue-comment:jira
    - read:graph:user:atlassian
    - read:graph:team:atlassian

app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/45ad98e8-54b8-4720-82fd-c3c1f305f4f7
